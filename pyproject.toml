[project]
name = "mr-mouse-stats"
version = "0.1.0"
description = "Mouse settings and settings history for pro Marvel Rivals players in the Ignite circuit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "flask>=3.1.3",
    "mangum>=0.21.0",
    "mwparserfromhell>=0.6.6",
    "psycopg[binary]>=3.3.4",
]

[project.scripts]
mr-mouse-stats = "mr_mouse_stats.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mr_mouse_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
