name: Deploy

# Does what scripts/deploy.sh does, with one addition: every image is tagged
# with its commit SHA and the Lambdas are pinned to the resulting immutable
# digest, so the rollback in CLOUD.md has something to name.
#
# scripts/deploy.sh stays supported — it is the break-glass path when GitHub is
# down, and still the fastest way to iterate on the frontend alone.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "git ref to deploy (blank = current main). Set to an older SHA to roll back."
        required: false
        type: string

permissions:
  id-token: write # mint the OIDC token for the deploy role
  contents: read

# Never cancel a deploy in flight: a half-finished one can leave the Lambdas
# on a new image and the frontend on the old one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Both images are ARM64 (Graviton Lambda and Fargate are ~20% cheaper and
    # nothing here is architecture-sensitive), so build on a native ARM runner
    # — free on public repositories.
    #
    # If this label is ever unavailable, switch to `ubuntu-latest` and add
    # before the buildx step:
    #
    #   - uses: docker/setup-qemu-action@v3
    #     with: { platforms: arm64 }
    #
    # Nothing else changes; builds go from ~2-3 min to ~5-10 under emulation.
    runs-on: ubuntu-24.04-arm

    # The approval gate. GitHub only mints a token whose `sub` is
    # `repo:...:environment:production` after the environment's required
    # reviewers approve — and that is the only `sub` the IAM role trusts. So
    # this is not just a UI prompt: without approval, no credentials exist.
    environment:
      name: production
      url: ${{ steps.tf.outputs.site_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          # Hardcoded rather than read from terraform: credentials are needed
          # before the state (which lives in us-east-1) can be read at all.
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          # The wrapper decorates stdout, which corrupts `terraform output`
          # capture.
          terraform_wrapper: false

      - run: terraform -chdir=infra init -input=false

      # The CD equivalent of the tf() helper in scripts/deploy.sh: every
      # identifier comes from the deployed stack, so it cannot drift.
      # All of these are public identifiers — neon_dsn is a variable, not an
      # output, so nothing sensitive is ever printed.
      - name: Read terraform outputs
        id: tf
        run: |
          terraform -chdir=infra output -json > "$RUNNER_TEMP/tf.json"
          for key in ecr_api_repository ecr_collector_repository \
                     api_base_url admin_api_base_url \
                     cognito_domain cognito_client_id cognito_region \
                     site_bucket site_url cloudfront_distribution_id \
                     database_direct_secret_arn; do
            value="$(jq -er ".${key}.value" "$RUNNER_TEMP/tf.json")"
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # provenance/sbom false is load-bearing, not hygiene. With buildx's
      # default attestations the push is an OCI image index wrapping the real
      # manifest plus an attestation manifest, and Lambda rejects it: "The
      # image manifest, config or layer media type for the source image ... is
      # not supported." Fargate accepts either form; the collector keeps the
      # flags so both images stay the same shape.
      - name: Build and push the API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lambda
          platforms: linux/arm64
          provenance: false
          sbom: false
          push: true
          tags: |
            ${{ steps.tf.outputs.ecr_api_repository }}:latest
            ${{ steps.tf.outputs.ecr_api_repository }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push the collector image
        id: collector
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          provenance: false
          sbom: false
          push: true
          tags: |
            ${{ steps.tf.outputs.ecr_collector_repository }}:latest
            ${{ steps.tf.outputs.ecr_collector_repository }}:${{ github.sha }}
          cache-from: type=gha,scope=collector
          cache-to: type=gha,mode=max,scope=collector

      # Before any new code runs, and after both images exist so a build
      # failure cannot leave the schema ahead of what is deployed.
      #
      # Migrations run from the collector image just built, so the SQL that
      # is applied is the SQL in the commit being deployed — a separate
      # Python setup here could resolve different package data. The image has
      # no boto3 (deliberately: it keeps the collector slim), so the DSN is
      # resolved here and passed in rather than read from inside.
      #
      # apply_migrations skips what is already recorded, so this is a no-op on
      # a normal deploy and on a rollback to an older ref. It does not roll
      # back — a migration that has to be undone is a hand operation against
      # the direct endpoint, as this one used to be.
      - name: Apply database migrations
        env:
          IMAGE: ${{ steps.tf.outputs.ecr_collector_repository }}@${{ steps.collector.outputs.digest }}
          SECRET_ARN: ${{ steps.tf.outputs.database_direct_secret_arn }}
        run: |
          MR_MOUSE_STATS_DB="$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ARN" --query SecretString --output text)"
          # Masked before it can reach a log line: `docker run` echoes nothing,
          # but a failure inside psycopg can put the DSN in a traceback.
          echo "::add-mask::$MR_MOUSE_STATS_DB"
          export MR_MOUSE_STATS_DB
          # `-e NAME`, not `-e NAME=value`: the latter puts the DSN in docker's
          # argv, where `ps` can read it for as long as the step runs. The
          # pass-through form takes it from this shell's environment instead.
          docker run --rm -e MR_MOUSE_STATS_DB "$IMAGE" migrate

      # By digest, not by tag: ECR tags are mutable, so `:latest` names
      # whatever was pushed most recently. A digest names this build forever,
      # which is what makes the rollback in CLOUD.md executable.
      # infra/api.tf has ignore_changes on image_uri so a later apply does not
      # revert this.
      - name: Roll the Lambdas onto the new image
        env:
          IMAGE: ${{ steps.tf.outputs.ecr_api_repository }}@${{ steps.api.outputs.digest }}
        run: |
          for fn in public-api admin-api; do
            echo "==> $fn -> $IMAGE"
            aws lambda update-function-code \
              --function-name "mr-mouse-stats-$fn" \
              --image-uri "$IMAGE" >/dev/null
          done
          # Without the wait the job can go green while the update is still
          # InProgress, so a failed image pull looks like a successful deploy.
          for fn in public-api admin-api; do
            aws lambda wait function-updated --function-name "mr-mouse-stats-$fn"
          done

      # desired_count is 1 with maximum_percent 100, so this is stop-then-start:
      # expect roughly a minute with no IRC coverage. That is deliberate — two
      # collectors would double-join every channel and both drive the
      # Liquipedia rate gate.
      - name: Restart the collector
        run: |
          aws ecs update-service \
            --cluster mr-mouse-stats \
            --service mr-mouse-stats-collector \
            --force-new-deployment >/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # Baked in at build time: a static export has no server to read env at
      # runtime. This is why CI's build is not reusable here.
      - name: Build the frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: ${{ steps.tf.outputs.api_base_url }}
          NEXT_PUBLIC_ADMIN_API_BASE: ${{ steps.tf.outputs.admin_api_base_url }}
          NEXT_PUBLIC_COGNITO_DOMAIN: ${{ steps.tf.outputs.cognito_domain }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ steps.tf.outputs.cognito_client_id }}
          NEXT_PUBLIC_COGNITO_REGION: ${{ steps.tf.outputs.cognito_region }}
        run: npm run build

      # Hashed assets cache forever; HTML must not, or a deploy is invisible.
      - name: Sync to S3
        env:
          BUCKET: ${{ steps.tf.outputs.site_bucket }}
        run: |
          aws s3 sync frontend/out "s3://$BUCKET" --delete \
            --exclude "*.html" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync frontend/out "s3://$BUCKET" --delete \
            --exclude "*" --include "*.html" --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.cloudfront_distribution_id }}" \
            --paths "/*" >/dev/null

      - name: Summary
        run: |
          {
            echo "### Deployed \`${{ inputs.ref || github.sha }}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Site | ${{ steps.tf.outputs.site_url }} |"
            echo "| API image | \`${{ steps.api.outputs.digest }}\` |"
            echo "| Collector image | \`${{ steps.collector.outputs.digest }}\` |"
            echo
            echo "Roll back by re-running this workflow with \`ref\` set to an earlier commit."
          } >> "$GITHUB_STEP_SUMMARY"
