name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes an in-flight check run. Safe here in a way it is not
# for deploys — nothing is mutated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: pytest
    runs-on: ubuntu-latest

    # The suite runs against a real Postgres — there is no in-memory
    # equivalent, and tests/conftest.py calls pytest.exit (not skip) when it
    # cannot connect, so a missing service fails the job loudly.
    #
    # Published on 55432 and named *_test to match DEFAULT_TEST_DSN in
    # conftest.py exactly: no MR_MOUSE_STATS_TEST_DSN override needed, and the
    # `_test` suffix satisfies the guard that refuses to TRUNCATE a database
    # that isn't obviously a throwaway.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mr_mouse_stats_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked, not a bare sync: it fails if uv.lock has drifted from
      # pyproject.toml, which is a free lockfile check and matches what both
      # Dockerfiles do.
      - run: uv sync --locked

      - run: uv run pytest

  frontend:
    name: build + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Build first, then typecheck: next-env.d.ts and .next/types/** are
      # gitignored and generated by the build, and tsconfig.json includes them,
      # so `tsc --noEmit` on a fresh clone fails without them.
      #
      # Deliberately built WITHOUT the NEXT_PUBLIC_* variables. lib/api.ts
      # falls back to http://127.0.0.1:8000, which compiles and typechecks
      # fine; the output is localhost-wired and is never uploaded. The deploy
      # workflow rebuilds from scratch with the real values from terraform.
      - run: npm run build

      - run: npm run typecheck
