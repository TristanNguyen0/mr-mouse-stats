<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Marvel Rivals pro mouse settings{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 64rem;
           padding: 0 1rem; color: #1a1a1a; }
    nav a { margin-right: 1.2rem; text-decoration: none; color: #0b62c4; }
    nav a.active { font-weight: 700; color: #1a1a1a; }
    h1 { font-size: 1.5em; }
    h2 { font-size: 1.15em; margin-top: 2rem; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid #ddd;
             vertical-align: top; white-space: nowrap; }
    td.raw { white-space: normal; }
    th { background: #f5f5f5; }
    tr.no-data td { color: #999; }
    .muted { color: #777; font-size: .9em; }
    .source { background: #eef; border-radius: 8px; padding: .05rem .5rem;
              font-size: .85em; }
    .tablewrap { overflow-x: auto; }
    footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #ddd;
             color: #777; font-size: .85em; }
    footer a { color: #0b62c4; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ root }}index.html" {% if page == 'index' %}class="active"{% endif %}>Overview</a>
    <a href="{{ root }}players.html" {% if page == 'players' %}class="active"{% endif %}>Players</a>
  </nav>
  {% block content %}{% endblock %}
  <footer>
    Player and tournament data from
    <a href="https://liquipedia.net/marvelrivals/">Liquipedia</a>, licensed
    <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA 3.0</a>.
    Settings observed passively from public Twitch chat.
    Generated {{ generated_at }}.
  </footer>
</body>
</html>
